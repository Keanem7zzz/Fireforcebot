# ==============================================================================
#  FIRE FORCE - workflow completo (RDP + Tailscale + BOT) - ARQUIVO UNICO
# ==============================================================================
#  Salve como:  .github/workflows/fireforce.yml
#
#  Este arquivo faz TUDO sozinho dentro da maquina:
#     - liga o RDP (usuario runneradmin + senha do segredo RDP_SENHA)
#     - entra no Tailscale (hostname fireforce-rdp)
#     - cria o .env com as chaves dos Segredos
#     - sobe o bot ESCONDIDO, com vigia (se cair, levanta de novo)
#     - cria os atalhos na area de trabalho (Ligar / Reiniciar / Status)
#     - mantem a maquina viva por ~5h42m e, ao acabar o tempo, dispara e
#       confirma a PROXIMA maquina pela API do GitHub antes de desligar
#       (sem depender de cron atrasado ou descartado pelo GitHub)
#
#  COMO FUNCIONA O CICLO CONTINUO:
#     - Voce clica em "Run workflow" UMA vez.
#     - Ao fim do ciclo (~5h42m), a maquina atual dispara a proxima via API,
#       confirma que ela entrou na fila, salva 100% no Supabase e desliga.
#     - No instante em que esta sai, a proxima assume automaticamente -> para
#       sempre, sem limite de ciclos.
#     - Se alguma etapa falhar por instabilidade temporaria, o passo de
#       recuperacao relanca automaticamente (com trava anti-loop se algo
#       estiver quebrado).
#     - Para PARAR de vez: basta clicar em "Cancel workflow" manualmente no
#       GitHub Actions (ele respeita o cancelamento e nao relanca sozinho).
#
#  Voce NAO precisa subir nenhum .ps1 ou .bat: a maquina cria os arquivos.
# ==============================================================================

name: Fire Force (RDP + Bot)

on:
  workflow_dispatch:            # ligue 1 vez e ele continua se relancando sozinho

# Permissao para esta run disparar a proxima run pela API do GitHub.
permissions:
  actions: write
  contents: read

# UMA maquina por vez: o proximo run fica na fila e entra no lugar do antigo.
# NUNCA rode duas ao mesmo tempo (o mesmo PIX contaria 2x e brigariam pelo token).
concurrency:
  group: fireforce-bot
  cancel-in-progress: false

env:
  SYNC_SEGUNDOS: "30"           # a maquina morre de repente: salva no Supabase mais seguido
  FF_DURACAO_MIN: "342"         # ~5h42m por ciclo (18 min de folga antes do limite de 6h)

jobs:
  maquina:
    runs-on: windows-latest
    timeout-minutes: 360        # LIMITE DO GITHUB: 6h. O ciclo troca aos ~5h42m.
    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: ⏱️ Anotar o início deste ciclo
        shell: pwsh
        run: |
          $agora = (Get-Date).ToUniversalTime()
          $agora.ToString('o') | Set-Content -Path "$env:GITHUB_WORKSPACE\ff_inicio_ciclo.txt" -Encoding UTF8
          Write-Host "Início deste ciclo: $($agora.ToString('dd/MM/yyyy HH:mm:ss')) UTC"
          Write-Host "Duração alvo configurada: $env:FF_DURACAO_MIN min (teto GitHub: 360 min)"

      # ---------------------------------------------------------------- RDP ---
      - name: 🖥️ Preparar o RDP (usuário runneradmin + senha do segredo)
        shell: pwsh
        run: |
          net user runneradmin "${{ secrets.RDP_SENHA }}"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: 🌐 Entrar no Tailscale
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\tailscale.msi"
          $baixou = $false
          for ($t = 1; $t -le 3; $t++) {
            try {
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi -TimeoutSec 60
              $baixou = $true
              break
            } catch {
              Write-Host "Tentativa $t/3 de baixar Tailscale falhou: $($_.Exception.Message)"
              if ($t -lt 3) { Start-Sleep -Seconds 5 }
            }
          }
          if (-not $baixou) { throw "Nao foi possivel baixar o instalador do Tailscale." }
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=fireforce-rdp --unattended --accept-routes
          $ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4) | Select-Object -First 1
          Write-Host "------------------------------------------------------"
          Write-Host "  Windows App -> fireforce-rdp   (ou $ip)"
          Write-Host "  Usuario: runneradmin           Senha: RDP_SENHA"
          Write-Host "------------------------------------------------------"

      # ------------------------------------------------------------- BOT ------
      - name: 🐍 Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As versões vêm FIXAS do requirements.txt: cada máquina nova monta
      # exatamente o mesmo conjunto de bibliotecas. Sem isso, uma versão nova
      # lançada no PyPI quebraria todas as máquinas seguintes sem nenhuma
      # mudança no código do bot.
      - name: 📦 Instalar as bibliotecas do bot (versões fixas do requirements.txt)
        shell: pwsh
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: 🛠️ Criar os controles do bot (vigia + atalhos)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE

          # ---- vigia: sobe o bot, auto-atualiza sem cair e levanta de novo se cair
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          $env:FF_SOB_VIGIA = "1"
          $log = Join-Path $PSScriptRoot "vigia.log"
          function Escrever($t) { Add-Content -Path $log -Value "[vigia] $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss') $t" -Encoding UTF8 }
          if ((Test-Path $log) -and ((Get-Item $log).Length -gt 4MB)) { Remove-Item $log -Force }
          $q = 0
          $flagFim = Join-Path $PSScriptRoot "_encerrar_ciclo.flag"
          $flagPausa = Join-Path $PSScriptRoot "ff_auto_update_pausado.flag"
          if (Test-Path $flagFim) { Remove-Item $flagFim -Force -ErrorAction SilentlyContinue }
          Escrever "vigia ligado (auto-update ativo)"
          while ($true) {
            if (Test-Path $flagFim) {
              Escrever "fim de ciclo sinalizado - vigia encerrando de forma limpa."
              break
            }
            # Se o bot fez rollback (a versao da main quebrou ao subir), NAO
            # puxo a main de novo: isso recolocaria exatamente o codigo quebrado
            # por cima da copia boa que o bot acabou de restaurar. O proprio bot
            # apaga este arquivo quando a main recebe uma correcao.
            if (Test-Path $flagPausa) {
              Escrever "auto-update pausado (versao da main quebrou) - mantendo a versao restaurada, sem puxar a main."
            } elseif (Test-Path (Join-Path $PSScriptRoot ".git")) {
              git fetch origin main --quiet 2>$null
              if ($LASTEXITCODE -eq 0) {
                git checkout -f origin/main -- fireforce_bot.py 2>$null
                git reset --mixed origin/main 2>$null
              }
            }
            $q++
            $inicio = Get-Date
            Escrever "subindo o bot (tentativa $q)"
            python fireforce_bot.py *>> $log
            $codigo = $LASTEXITCODE
            if (Test-Path $flagFim) {
              Escrever "bot salvou estado e encerrou para troca limpa de maquina (codigo $codigo)."
              break
            }
            if ($codigo -eq 42) {
              $q = 0
              Escrever "auto-update aplicado com sucesso (codigo 42) - relancando nova versao em 1s!"
              Start-Sleep -Seconds 1
              continue
            }
            if (((Get-Date) - $inicio).TotalSeconds -ge 120) { $q = 0 }
            Escrever "o bot saiu (codigo $codigo)"
            if ($q -ge 300) { Escrever "300 quedas seguidas - parando. Rode o bot na mao e leia o erro."; break }
            Start-Sleep -Seconds 5
          }
          '@ | Set-Content -Path (Join-Path $ws 'vigia_bot.ps1') -Encoding UTF8

          # ---- ligar o bot (escondido, com vigia) ------------------------------
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host "O bot JA esta no ar (PID $($p.ProcessId -join ','))." -ForegroundColor Green; exit }
          Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",(Join-Path $PSScriptRoot 'vigia_bot.ps1') -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host "BOT NO AR (PID $($p.ProcessId -join ','))." -ForegroundColor Green }
          else { Write-Host "O bot NAO subiu - veja o vigia.log nesta pasta." -ForegroundColor Red }
          '@ | Set-Content -Path (Join-Path $ws 'iniciar_bot.ps1') -Encoding UTF8

          # ---- reiniciar (pra usar dentro do RDP: puxa a ultima versao do GitHub e reinicia) --
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          Write-Host "Atualizando codigo do repositorio (git pull)..." -ForegroundColor Cyan
          git pull origin main
          Write-Host "Encerrando o bot atual (se estiver rodando)..."
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*fireforce_bot.py*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          & (Join-Path $PSScriptRoot "iniciar_bot.ps1")
          Read-Host "Aperte ENTER pra fechar"
          '@ | Set-Content -Path (Join-Path $ws 'reiniciar_bot.ps1') -Encoding UTF8

          # ---- status (pra usar dentro do RDP) ---------------------------------
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          Write-Host ""
          Write-Host "  ============================================" -ForegroundColor DarkCyan
          Write-Host "    FIRE FORCE - STATUS DO BOT" -ForegroundColor Cyan
          Write-Host "  ============================================" -ForegroundColor DarkCyan
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host ("  BOT NO AR - PID " + ($p.ProcessId -join ",")) -ForegroundColor Green }
          else { Write-Host "  BOT PARADO - use o atalho Ligar bot" -ForegroundColor Red }
          Write-Host ""
          Write-Host "  Ultimas linhas do vigia.log:" -ForegroundColor Gray
          $log = Join-Path $PSScriptRoot "vigia.log"
          if (Test-Path $log) { Get-Content $log -Tail 15 } else { Write-Host "  (o vigia.log ainda nao existe)" -ForegroundColor DarkGray }
          Write-Host ""
          Write-Host "  No Discord, /saude mostra Supabase, pendencias e status operacional." -ForegroundColor Gray
          Read-Host "  Aperte ENTER pra fechar"
          '@ | Set-Content -Path (Join-Path $ws 'status_bot.ps1') -Encoding UTF8

          # ---- atalhos na area de trabalho (area de trabalho do RDP) -----------
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $sh = New-Object -ComObject WScript.Shell
          $atalhos = @(
            @{ Nome = 'Fire Force - Ligar bot';     Arquivo = (Join-Path $ws 'iniciar_bot.ps1') },
            @{ Nome = 'Fire Force - Reiniciar bot'; Arquivo = (Join-Path $ws 'reiniciar_bot.ps1') },
            @{ Nome = 'Fire Force - Status do bot'; Arquivo = (Join-Path $ws 'status_bot.ps1') }
          )
          foreach ($a in $atalhos) {
            $lnk = $sh.CreateShortcut((Join-Path $desktop "$($a.Nome).lnk"))
            $lnk.TargetPath = 'powershell.exe'
            $lnk.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$($a.Arquivo)`""
            $lnk.WorkingDirectory = $ws
            $lnk.Description = 'Fire Force - Liga de Diario'
            $lnk.Save()
          }
          Write-Host "Controles prontos: vigia_bot.ps1, iniciar_bot.ps1, reiniciar_bot.ps1, status_bot.ps1"
          Write-Host "E 3 atalhos na area de trabalho: Ligar bot / Reiniciar bot / Status do bot"

      - name: 🔐 Criar o .env do bot (vindo dos Segredos)
        shell: pwsh
        env:
          DISCORD_TOKEN:             ${{ secrets.DISCORD_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ID:               ${{ secrets.SUPABASE_ID }}
        run: |
          $linhas = @()
          foreach ($k in @("DISCORD_TOKEN","SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","SUPABASE_ANON_KEY","SUPABASE_KEY","SUPABASE_ID")) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($v) { $linhas += "$k=$v" }
          }
          $linhas += "SYNC_SEGUNDOS=30"
          $linhas | Set-Content -Path "$env:GITHUB_WORKSPACE\.env" -Encoding UTF8
          Write-Host "(.env criado com $($linhas.Count) linha(s) - nenhuma chave aparece no log)"

      - name: 🤖 Subir o bot
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\iniciar_bot.ps1"
          Start-Sleep -Seconds 12
          Write-Host "--- vigia.log ---"
          if (Test-Path .\vigia.log) { Get-Content .\vigia.log -Tail 20 }

      # ------------------------------------------------ MANTER VIVA ------------
      # Cada maquina roda ~5h42m (medido a partir do inicio do ciclo).
      # Antes de desligar, ela mesma chama a API do GitHub para colocar a
      # proxima run na fila e SO encerra depois de confirmar que a sucessora
      # esta na fila esperando. Isso garante funcionamento continuo para sempre
      # sem depender de cron do GitHub (que atrasa ou falha sob carga).
      - name: 🕒 Manter a máquina viva (até passar o bastão para a próxima)
        id: ciclo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $agora = (Get-Date).ToUniversalTime()

          $duracaoMin = 342
          if ($env:FF_DURACAO_MIN) {
            try { $duracaoMin = [int]$env:FF_DURACAO_MIN } catch { $duracaoMin = 342 }
          }
          if ($duracaoMin -lt 5) { $duracaoMin = 5 }
          if ($duracaoMin -gt 348) { $duracaoMin = 348 }

          $inicioDaRun = $agora
          $carimbo = "$env:GITHUB_WORKSPACE\ff_inicio_ciclo.txt"
          if (Test-Path $carimbo) {
            try {
              $inicioDaRun = [datetime]::Parse(
                (Get-Content $carimbo -Raw).Trim(),
                [System.Globalization.CultureInfo]::InvariantCulture,
                [System.Globalization.DateTimeStyles]::RoundtripKind
              ).ToUniversalTime()
            } catch { }
          }

          $alvo = $inicioDaRun.AddMinutes($duracaoMin)
          $tetoDisparo = $inicioDaRun.AddMinutes(355)   # margem p/ retries antes do corte de 6h

          $duracaoRestante = [int][Math]::Max(0, ($alvo - $agora).TotalMinutes)
          Write-Host "======================================================"
          Write-Host ("  BOT NO AR ATE: {0:dd/MM HH:mm} UTC  ({1}h {2}min restantes)" -f $alvo, [int][math]::Floor($duracaoRestante/60), ($duracaoRestante % 60))
          Write-Host "  Ao fim deste tempo, a proxima maquina sera ligada automaticamente."
          Write-Host "  Para desligar de vez: cancele o workflow manualmente no GitHub Actions."
          Write-Host "======================================================"

          # ------------------------------------------------------------- laço -------
          while ((Get-Date).ToUniversalTime() -lt $alvo) {
            $restaSeg = [int](($alvo - (Get-Date).ToUniversalTime()).TotalSeconds)
            if ($restaSeg -le 0) { break }
            $dormirSeg = [Math]::Min(120, [Math]::Max(5, $restaSeg))
            Start-Sleep -Seconds $dormirSeg

            $proc = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                    Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
            if (-not $proc) {
              Write-Host "[$(Get-Date -Format 'HH:mm')] o bot caiu - levantando de novo..."
              powershell -NoProfile -ExecutionPolicy Bypass -File .\iniciar_bot.ps1 *>&1 | ForEach-Object { Write-Host $_ }
              $proc = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                      Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
            }
            $resta = [int][Math]::Max(0, ($alvo - (Get-Date).ToUniversalTime()).TotalMinutes)
            Write-Host "[$(Get-Date -Format 'HH:mm')] bot: $(if ($proc) { 'NO AR (PID ' + ($proc.ProcessId -join ',') + ')' } else { 'PARADO' }) | faltam $resta min"
          }

          # ---------------------------------------- disparar próxima máquina ---
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $meuId = [long]$env:GITHUB_RUN_ID
          $ref = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "main" }

          $wfId = "fireforce.yml"
          try {
            $runAtual = Invoke-RestMethod -Uri "$api/actions/runs/$meuId" -Headers $headers -Method Get -TimeoutSec 20
            if ($runAtual -and $runAtual.workflow_id) { $wfId = "$($runAtual.workflow_id)" }
          } catch {
            Write-Host "Aviso ao consultar workflow_id (usando fireforce.yml): $($_.Exception.Message)"
          }

          function FF-ProximaNaFila {
            try {
              $resp = Invoke-RestMethod -Uri "$api/actions/workflows/$wfId/runs?per_page=20" -Headers $headers -Method Get -TimeoutSec 20
              $ativas = @($resp.workflow_runs | Where-Object {
                ([long]$_.id -gt $meuId) -and ($_.status -in @("queued", "waiting", "pending", "requested", "in_progress"))
              })
              if ($ativas.Count -gt 0) { return $ativas[0] }
            } catch {
              Write-Host "Aviso ao consultar fila: $($_.Exception.Message)"
            }
            return $null
          }

          $confirmada = $false
          $tentativa = 0
          while ((Get-Date).ToUniversalTime() -lt $tetoDisparo) {
            $existente = FF-ProximaNaFila
            if ($existente) {
              Write-Host "✅ Próxima máquina confirmada na fila! (Run ID $($existente.id) | status: $($existente.status))"
              $confirmada = $true
              break
            }

            $tentativa++
            Write-Host "🚀 Disparando próxima máquina (tentativa $tentativa, workflow=$wfId, ref=$ref)..."
            $disparoOk = $false
            try {
              $corpo = @{ ref = $ref } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "$api/actions/workflows/$wfId/dispatches" -Headers $headers -Method Post -Body $corpo -ContentType 'application/json' -TimeoutSec 25 | Out-Null
              $disparoOk = $true
            } catch {
              $codHttp = $null
              try { if ($_.Exception -and $_.Exception.Response) { $codHttp = [int]$_.Exception.Response.StatusCode } } catch {}
              Write-Host "⚠️ Falha no disparo (HTTP $codHttp): $($_.Exception.Message)"
              if ($codHttp -eq 422 -and $ref -ne "main") {
                try {
                  $corpoMain = @{ ref = "main" } | ConvertTo-Json -Compress
                  Invoke-RestMethod -Uri "$api/actions/workflows/$wfId/dispatches" -Headers $headers -Method Post -Body $corpoMain -ContentType 'application/json' -TimeoutSec 25 | Out-Null
                  $ref = "main"
                  $disparoOk = $true
                } catch {
                  Write-Host "⚠️ Fallback para ref=main também falhou: $($_.Exception.Message)"
                }
              }
            }

            if ($disparoOk) {
              for ($p = 0; $p -lt 8; $p++) {
                Start-Sleep -Seconds 4
                $existente = FF-ProximaNaFila
                if ($existente) {
                  Write-Host "✅ Próxima máquina confirmada na fila! (Run ID $($existente.id) | status: $($existente.status))"
                  $confirmada = $true
                  break
                }
              }
              if ($confirmada) { break }
              Write-Host "Aguardando confirmação da próxima run na fila..."
            } else {
              Start-Sleep -Seconds 15
            }
          }

          if ($confirmada -and $env:GITHUB_OUTPUT) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "proxima_disparada=1" -Encoding utf8NoBOM
          } elseif (-not $confirmada) {
            Write-Host "❌ AVISO: não foi possível confirmar a próxima run na fila até o teto de 5h55m."
          }

          # -------------------------------------------------- encerramento limpo ---
          # O bot salva TUDO no Supabase e fecha; a próxima run já está na fila
          # pronta para assumir no instante em que esta liberar.
          Write-Host "Sinalizando encerramento limpo para o bot salvar 100% do estado no Supabase antes de desligar..."
          Set-Content -Path "$env:GITHUB_WORKSPACE\_encerrar_ciclo.flag" -Value "1" -Encoding UTF8
          $saiu = $false
          for ($i = 0; $i -lt 40; $i++) {
            $ainda = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                     Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
            if (-not $ainda) { $saiu = $true; break }
            Start-Sleep -Seconds 1
          }

          if (-not $saiu) {
            Write-Host "Bot demorou >40s para sair; encerrando processo remanescente para não duplicar conexão."
            Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like "*fireforce_bot.py*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

          Start-Sleep -Seconds 2
          Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*vigia_bot.ps1*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:GITHUB_WORKSPACE\_encerrar_ciclo.flag" -Force -ErrorAction SilentlyContinue

          if (Test-Path 'C:\Program Files\Tailscale\tailscale.exe') {
            try { & 'C:\Program Files\Tailscale\tailscale.exe' logout 2>$null } catch { }
          }

          if ($saiu) {
            Write-Host "Fim do ciclo limpo! Estado salvo no Supabase e a próxima máquina assume em seguida."
          } else {
            Write-Host "Ciclo encerrado (sync de 30s já havia salvo). Liberando para a próxima máquina assumir."
          }

          if (-not $confirmada) {
            throw "Nao foi possivel confirmar a proxima run antes do encerramento."
          }

      # Recupera automaticamente se um passo falhar (ex: falha temporaria de rede)
      # NUNCA executa quando voce cancela o workflow manualmente (!cancelled()).
      - name: 🔁 Recuperar ciclo automaticamente em caso de falha inesperada
        if: ${{ failure() && !cancelled() && steps.ciclo.outputs.proxima_disparada != '1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $meuId = [long]$env:GITHUB_RUN_ID
          $ref = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "main" }

          $wfId = "fireforce.yml"
          try {
            $runAtual = Invoke-RestMethod -Uri "$api/actions/runs/$meuId" -Headers $headers -Method Get -TimeoutSec 20
            if ($runAtual -and $runAtual.workflow_id) { $wfId = "$($runAtual.workflow_id)" }
          } catch { }

          function FF-ToUtc([object]$v) {
            if ($v -is [datetime]) { return $v.ToUniversalTime() }
            return [datetime]::Parse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::RoundtripKind).ToUniversalTime()
          }

          try {
            $resp = Invoke-RestMethod -Uri "$api/actions/workflows/$wfId/runs?per_page=15" -Headers $headers -Method Get -TimeoutSec 20
            $runs = @($resp.workflow_runs)

            $jaNaFila = @($runs | Where-Object {
              ([long]$_.id -gt $meuId) -and ($_.status -in @("queued", "waiting", "pending", "requested", "in_progress"))
            })
            if ($jaNaFila.Count -gt 0) {
              Write-Host "Já existe uma run sucessora na fila (ID $($jaNaFila[0].id)). Nada a fazer."
              exit 0
            }

            $limiteTempo = (Get-Date).ToUniversalTime().AddMinutes(-20)
            $falhasRecentes = @($runs | Where-Object {
              ([long]$_.id -ne $meuId) -and
              ($_.conclusion -eq "failure") -and
              ((FF-ToUtc $_.created_at) -gt $limiteTempo)
            })
            if ($falhasRecentes.Count -ge 3) {
              Write-Host "❌ Trava anti-loop: 3+ falhas seguidas nos últimos 20 min. Verifique os Segredos (DISCORD_TOKEN/TAILSCALE_AUTHKEY/RDP_SENHA) e ligue manualmente."
              exit 0
            }
          } catch {
            Write-Host "Aviso ao verificar histórico de falhas: $($_.Exception.Message)"
          }

          Write-Host "Aguardando 20s antes de relançar automaticamente após a falha..."
          Start-Sleep -Seconds 20
          try {
            $corpo = @{ ref = $ref } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "$api/actions/workflows/$wfId/dispatches" -Headers $headers -Method Post -Body $corpo -ContentType 'application/json' -TimeoutSec 25 | Out-Null
            Write-Host "✅ Run de recuperação disparada com sucesso!"
          } catch {
            $codHttp = $null
            try { if ($_.Exception -and $_.Exception.Response) { $codHttp = [int]$_.Exception.Response.StatusCode } } catch {}
            Write-Host "❌ Falha ao disparar run de recuperação (HTTP $codHttp): $($_.Exception.Message)"
          }

      - name: 📄 Resumo e últimas linhas do log
        if: always()
        shell: pwsh
        run: |
          Write-Host "======================================================"
          Write-Host "  FIRE FORCE - resumo do ciclo"
          Write-Host "  RDP: Windows App > fireforce-rdp > runneradmin"
          Write-Host "  Atalhos na area de trabalho: Ligar / Reiniciar / Status"
          Write-Host "  Conferir no Discord: /saude"
          Write-Host "======================================================"
          if (Test-Path .\vigia.log) { Get-Content .\vigia.log -Tail 30 }
