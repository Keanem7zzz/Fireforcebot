# ==============================================================================
#  FIRE FORCE - workflow completo (RDP + Tailscale + BOT) - ARQUIVO UNICO
# ==============================================================================
#  Salve como:  .github/workflows/fireforce.yml
#
#  Este arquivo faz TUDO sozinho dentro da máquina:
#     - PREAQUECE a máquina nova (RDP, Tailscale, Python, libs, .env, scripts)
#       ENQUANTO a máquina antiga continua com o bot no ar atendendo os jogadores
#     - faz a TROCA DE BASTÃO usando só a API de runs do GitHub: quando a máquina
#       nova entra, a antiga percebe em ~2s, salva 100% no Supabase, sai do
#       Tailscale e encerra limpo
#     - só então a nova entra no Tailscale (hostname fireforce-rdp limpo) e sobe
#       o bot -> janela offline de ~3 a 5 segundos, NUNCA dois bots ao mesmo tempo
#     - vigia o bot (se cair, levanta de novo) e cria os atalhos da área de trabalho
#     - mantém a máquina viva por ~5h50 e, se ninguém assumir, dispara a próxima
#       sozinha (fallback aos 338 min) além do cron a cada 5h
#
#  No repositório ficam apenas 2 arquivos:
#     fireforce_bot.py
#     .github/workflows/fireforce.yml   (este)
# ==============================================================================

name: Fire Force (RDP + Bot)

on:
  workflow_dispatch:            # seu botao de sempre: Run workflow
  schedule:
    - cron: "0 */5 * * *"       # relanca a cada 5h -> emenda sem buraco

# ⚠️ SEM trava de concorrência: a máquina nova PRECISA rodar em paralelo com a
# antiga para pré-aquecer. Quem garante "nunca dois bots juntos" é o bastão:
#   • a run mais NOVA sempre tem prioridade; a mais antiga sai limpa sozinha
#   • a nova só sobe o bot depois que a antiga sai da lista de runs em execução
#   • se a antiga travar, é cancelada (o bot salva no Supabase a cada 30s)

# A API do GitHub é usada para: passar o bastão, esperar a antiga encerrar,
# cancelar a antiga em caso de travamento e disparar a próxima máquina (fallback).
permissions:
  actions: write
  contents: read

env:
  SYNC_SEGUNDOS: "30"           # a maquina morre de repente: salva no Supabase mais seguido

jobs:
  maquina:
    runs-on: windows-latest
    timeout-minutes: 360        # LIMITE DO GITHUB: 6h. O loop interno para antes (5h50).
    steps:
      # ======================================================================
      #  FASE 1 — PRÉ-AQUECIMENTO (a máquina antiga segue online e atendendo)
      # ======================================================================
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- RDP ---
      - name: 🖥️ Preparar o RDP (usuário runneradmin + senha do segredo)
        shell: pwsh
        run: |
          net user runneradmin "${{ secrets.RDP_SENHA }}"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: 🌐 Instalar o Tailscale (MSI apenas — o 'up' é só no bastão)
        shell: pwsh
        run: |
          # Instala o MSI só para deixar o executável pronto. O `tailscale up` fica
          # para depois do bastão, para o hostname fireforce-rdp não virar -1.
          $msi = "$env:RUNNER_TEMP\tailscale.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          if (-not (Test-Path 'C:\Program Files\Tailscale\tailscale.exe')) { throw "Tailscale não instalou corretamente." }
          Write-Host "Tailscale instalado (aguardando o bastão para o 'up')."

      # ------------------------------------------------------------- BOT ------
      - name: 🐍 Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar as bibliotecas do bot
        shell: pwsh
        run: python -m pip install --quiet --disable-pip-version-check discord.py aiohttp aiosqlite "qrcode[pil]" Pillow

      - name: 🛠️ Criar os controles do bot (vigia + atalhos + bastão)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE

          # ---- vigia: sobe o bot, auto-atualiza sem cair e levanta de novo se cair
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          $env:FF_SOB_VIGIA = "1"
          $log = Join-Path $PSScriptRoot "vigia.log"
          function Escrever($t) { Add-Content -Path $log -Value "[vigia] $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss') $t" -Encoding UTF8 }
          if ((Test-Path $log) -and ((Get-Item $log).Length -gt 4MB)) { Remove-Item $log -Force }
          $q = 0
          $flagFim = Join-Path $PSScriptRoot "_encerrar_ciclo.flag"
          if (Test-Path $flagFim) { Remove-Item $flagFim -Force -ErrorAction SilentlyContinue }
          Escrever "vigia ligado (auto-update ativo)"
          while ($true) {
            if (Test-Path $flagFim) {
              Escrever "fim de ciclo sinalizado - vigia encerrando de forma limpa."
              break
            }
            if (Test-Path (Join-Path $PSScriptRoot ".git")) {
              git fetch origin main --quiet 2>$null
              if ($LASTEXITCODE -eq 0) {
                git checkout -f origin/main -- fireforce_bot.py 2>$null
                git reset --mixed origin/main 2>$null
              }
            }
            $q++
            $inicio = Get-Date
            Escrever "subindo o bot (tentativa $q)"
            python fireforce_bot.py *>> $log
            $codigo = $LASTEXITCODE
            if (Test-Path $flagFim) {
              Escrever "bot salvou estado e encerrou para troca limpa de maquina (codigo $codigo)."
              break
            }
            if ($codigo -eq 42) {
              $q = 0
              Escrever "auto-update aplicado com sucesso (codigo 42) - relancando nova versao em 1s!"
              Start-Sleep -Seconds 1
              continue
            }
            if (((Get-Date) - $inicio).TotalSeconds -ge 120) { $q = 0 }
            Escrever "o bot saiu (codigo $codigo)"
            if ($q -ge 300) { Escrever "300 quedas seguidas - parando. Rode o bot na mao e leia o erro."; break }
            Start-Sleep -Seconds 5
          }
          '@ | Set-Content -Path (Join-Path $ws 'vigia_bot.ps1') -Encoding UTF8

          # ---- ligar o bot (escondido, com vigia) ------------------------------
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host "O bot JA esta no ar (PID $($p.ProcessId -join ','))." -ForegroundColor Green; exit }
          Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",(Join-Path $PSScriptRoot 'vigia_bot.ps1') -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host "BOT NO AR (PID $($p.ProcessId -join ','))." -ForegroundColor Green }
          else { Write-Host "O bot NAO subiu - veja o vigia.log nesta pasta." -ForegroundColor Red }
          '@ | Set-Content -Path (Join-Path $ws 'iniciar_bot.ps1') -Encoding UTF8

          # ---- reiniciar (pra usar dentro do RDP: puxa a ultima versao do GitHub e reinicia) --
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          Write-Host "Atualizando codigo do repositorio (git pull)..." -ForegroundColor Cyan
          git pull origin main
          Write-Host "Encerrando o bot atual (se estiver rodando)..."
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*fireforce_bot.py*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          & (Join-Path $PSScriptRoot "iniciar_bot.ps1")
          Read-Host "Aperte ENTER pra fechar"
          '@ | Set-Content -Path (Join-Path $ws 'reiniciar_bot.ps1') -Encoding UTF8

          # ---- status (pra usar dentro do RDP) ---------------------------------
          @'
          $ErrorActionPreference = "Continue"
          Set-Location -Path $PSScriptRoot
          Write-Host ""
          Write-Host "  ============================================" -ForegroundColor DarkCyan
          Write-Host "    FIRE FORCE - STATUS DO BOT" -ForegroundColor Cyan
          Write-Host "  ============================================" -ForegroundColor DarkCyan
          $p = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
          if ($p) { Write-Host ("  BOT NO AR - PID " + ($p.ProcessId -join ",")) -ForegroundColor Green }
          else { Write-Host "  BOT PARADO - use o atalho Ligar bot" -ForegroundColor Red }
          Write-Host ""
          Write-Host "  Ultimas linhas do vigia.log:" -ForegroundColor Gray
          $log = Join-Path $PSScriptRoot "vigia.log"
          if (Test-Path $log) { Get-Content $log -Tail 15 } else { Write-Host "  (o vigia.log ainda nao existe)" -ForegroundColor DarkGray }
          Write-Host ""
          Write-Host "  No Discord, /saude mostra Supabase, pendencias e status operacional." -ForegroundColor Gray
          Read-Host "  Aperte ENTER pra fechar"
          '@ | Set-Content -Path (Join-Path $ws 'status_bot.ps1') -Encoding UTF8

          # ---- atalhos na area de trabalho (area de trabalho do RDP) -----------
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $sh = New-Object -ComObject WScript.Shell
          $atalhos = @(
            @{ Nome = 'Fire Force - Ligar bot';     Arquivo = (Join-Path $ws 'iniciar_bot.ps1') },
            @{ Nome = 'Fire Force - Reiniciar bot'; Arquivo = (Join-Path $ws 'reiniciar_bot.ps1') },
            @{ Nome = 'Fire Force - Status do bot'; Arquivo = (Join-Path $ws 'status_bot.ps1') }
          )
          foreach ($a in $atalhos) {
            $lnk = $sh.CreateShortcut((Join-Path $desktop "$($a.Nome).lnk"))
            $lnk.TargetPath = 'powershell.exe'
            $lnk.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$($a.Arquivo)`""
            $lnk.WorkingDirectory = $ws
            $lnk.Description = 'Fire Force - Liga de Diario'
            $lnk.Save()
          }
          Write-Host "Controles prontos: vigia_bot.ps1, iniciar_bot.ps1, reiniciar_bot.ps1, status_bot.ps1"
          Write-Host "E 3 atalhos na area de trabalho: Ligar bot / Reiniciar bot / Status do bot"

      # ---------- helpers de bastão (API do GitHub) — usados nos próximos steps
      - name: 🔗 Criar os helpers do bastão
        shell: pwsh
        run: |
          @'
          # Ferramentas de bastão: usa SOMENTE a API de runs (permissões actions:read/write).
          $ErrorActionPreference = "Continue"
          $script:FFApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $script:FFHeaders = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function FF-RunsAtivas {
            # Runs em execução DESTE workflow, sem contar a minha.
            try {
              $uri = "$script:FFApi/actions/workflows/fireforce.yml/runs?status=in_progress&per_page=50"
              $r = Invoke-RestMethod -Uri $uri -Headers $script:FFHeaders -Method Get -TimeoutSec 15
              return @($r.workflow_runs | Where-Object { "$($_.id)" -ne "$env:GITHUB_RUN_ID" })
            } catch { return @() }
          }

          function FF-CancelarRun([long]$id) {
            try {
              Invoke-RestMethod -Uri "$script:FFApi/actions/runs/$id/cancel" -Headers $script:FFHeaders -Method Post -TimeoutSec 15 | Out-Null
              return $true
            } catch { return $false }
          }

          function FF-DispararProxima {
            try {
              $corpo = @{ ref = "main" } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "$script:FFApi/actions/workflows/fireforce.yml/dispatches" -Headers $script:FFHeaders -Method Post -Body $corpo -ContentType 'application/json' -TimeoutSec 20 | Out-Null
              return $true
            } catch {
              Write-Host "aviso: falha ao disparar a próxima máquina: $($_.Exception.Message)"
              return $false
            }
          }

          function FF-RunMaisNova {
            # Existe alguma run MAIS NOVA que a minha em execução? (ela tem prioridade)
            $minha = [long]$env:GITHUB_RUN_ID
            $outras = @(FF-RunsAtivas)
            $novas = @($outras | Where-Object { [long]$_.id -gt $minha } | Sort-Object { [long]$_.id } -Descending)
            if ($novas.Count -gt 0) { return $novas[0] }
            return $null
          }
          '@ | Set-Content -Path "$env:GITHUB_WORKSPACE\bastao_helpers.ps1" -Encoding UTF8
          Write-Host "bastao_helpers.ps1 criado."

      - name: 🔐 Criar o .env do bot (vindo dos Segredos)
        shell: pwsh
        env:
          DISCORD_TOKEN:             ${{ secrets.DISCORD_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ID:               ${{ secrets.SUPABASE_ID }}
        run: |
          $linhas = @()
          foreach ($k in @("DISCORD_TOKEN","SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","SUPABASE_ANON_KEY","SUPABASE_KEY","SUPABASE_ID")) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($v) { $linhas += "$k=$v" }
          }
          $linhas += "SYNC_SEGUNDOS=30"
          $linhas | Set-Content -Path "$env:GITHUB_WORKSPACE\.env" -Encoding UTF8
          Write-Host "(.env criado com $($linhas.Count) linha(s) - nenhuma chave aparece no log)"

      # ======================================================================
      #  FASE 2 — TROCA DE BASTÃO (a antiga só sai depois que esta está pronta)
      # ======================================================================
      - name: 🚦 Pronto para assumir (esperar a máquina antiga sair limpa)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . "$env:GITHUB_WORKSPACE\bastao_helpers.ps1"
          $meu = [long]$env:GITHUB_RUN_ID
          try {
            $outras = @(FF-RunsAtivas)
          } catch {
            $outras = @()
          }
          Write-Host "Máquina(s) no ar antes de mim: $($outras.Count)"

          # Regra de ouro: a run MAIS NOVA tem prioridade. Se já existe uma run mais
          # nova em execução, esta aqui é descartada (nunca dois bots ao mesmo tempo).
          $maisNova = FF-RunMaisNova
          if ($maisNova) {
            Write-Host "A run mais nova ($($maisNova.id)) tem prioridade. Esta run encerra sem subir o bot."
            Write-Host "::notice title=Run dispensada::A run $($maisNova.id) assumiu a frente."
            "FF_ASSUMIU=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          # Espera as runs antigas saírem: elas percebem a minha presença em ~2s,
          # salvam no Supabase, saem do Tailscale e terminam (até 180s de teto).
          $limite = (Get-Date).AddSeconds(180)
          $ultimoAviso = Get-Date
          while ((Get-Date) -lt $limite) {
            $maisNova = FF-RunMaisNova
            if ($maisNova) {
              Write-Host "A run mais nova ($($maisNova.id)) apareceu durante a espera. Encerrando esta run."
              Write-Host "::notice title=Run dispensada::A run $($maisNova.id) assumiu a frente."
              "FF_ASSUMIU=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              exit 0
            }
            $restantes = @(FF-RunsAtivas)
            if ($restantes.Count -eq 0) { break }
            if (((Get-Date) - $ultimoAviso).TotalSeconds -ge 20) {
              Write-Host ("[{0:HH:mm:ss}] aguardando encerramento limpo: {1} run(s) antiga(s) ainda ativa(s)..." -f (Get-Date), $restantes.Count)
              $ultimoAviso = Get-Date
            }
            Start-Sleep -Seconds 2
          }

          # Sobrou alguma máquina travada? Cancela (o bot salva no Supabase a cada 30s).
          $travadas = @(FF-RunsAtivas | Where-Object { [long]$_.id -lt $meu })
          foreach ($r in $travadas) {
            Write-Host ("Máquina antiga não encerrou no prazo (run {0}). Cancelando para liberar o hostname." -f $r.id)
            [void](FF-CancelarRun([long]$r.id))
          }
          if ($travadas.Count -gt 0) { Start-Sleep -Seconds 15 }

          "FF_ASSUMIU=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Assumindo agora (janela offline de poucos segundos)."

      # ======================================================================
      #  FASE 3 — ASSUMIR: Tailscale com hostname limpo + bot no ar
      # ======================================================================
      - name: 🌐 Entrar no Tailscale (hostname limpo) e subir o bot
        if: env.FF_ASSUMIU == '1'
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=fireforce-rdp --unattended --accept-routes
          $ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4) | Select-Object -First 1
          Write-Host "------------------------------------------------------"
          Write-Host "  Windows App -> fireforce-rdp   (ou $ip)"
          Write-Host "  Usuario: runneradmin           Senha: RDP_SENHA"
          Write-Host "------------------------------------------------------"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\iniciar_bot.ps1"
          Start-Sleep -Seconds 12
          Write-Host "--- vigia.log ---"
          if (Test-Path .\vigia.log) { Get-Content .\vigia.log -Tail 20 }

      # ======================================================================
      #  FASE 4 — MANTER VIVA + ENTREGAR O BASTÃO QUANDO A PRÓXIMA CHEGAR
      # ======================================================================
      - name: 🕒 Manter a máquina viva (e sair limpo quando a próxima chegar)
        if: env.FF_ASSUMIU == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . "$env:GITHUB_WORKSPACE\bastao_helpers.ps1"
          $meu = [long]$env:GITHUB_RUN_ID
          $fim = (Get-Date).AddMinutes(350)           # 5h50: termina ANTES do corte de 6h
          $avisoFallback = (Get-Date).AddMinutes(338) # 5h38: dispara a próxima se ninguém veio
          $fallbackFeito = $false
          $ultimoLog = Get-Date
          $ultimoPoll = (Get-Date).AddSeconds(-30)

          function EncerrarLimpo([string]$motivo) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Encerrando de forma limpa: $motivo"
            Write-Host "Sinalizando para o bot salvar 100% do estado no Supabase..."
            Set-Content -Path "$env:GITHUB_WORKSPACE\_encerrar_ciclo.flag" -Value "1" -Encoding UTF8
            for ($i = 0; $i -lt 20; $i++) {
              $ainda = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                       Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
              if (-not $ainda) { break }
              Start-Sleep -Seconds 1
            }
            Remove-Item "$env:GITHUB_WORKSPACE\_encerrar_ciclo.flag" -Force -ErrorAction SilentlyContinue
            # Solta o hostname fireforce-rdp para a máquina nova entrar limpa.
            try { & 'C:\Program Files\Tailscale\tailscale.exe' logout } catch {}
            Write-Host "Estado salvo, Tailscale desconectado. A próxima máquina pode assumir."
          }

          while ($true) {
            $agora = Get-Date

            # (a) apareceu uma run MAIS NOVA? então é hora de sair limpo.
            # Poll de 8s no dia a dia e de 2s nos últimos 12 minutos (perto do
            # fallback), para o bastão ser percebido em ~2s sem estourar o
            # limite de requisições da API do GitHub.
            $retaFinal = ((Get-Date) -ge $avisoFallback)
            $intervaloPoll = if ($retaFinal) { 2 } else { 8 }
            if (($agora - $ultimoPoll).TotalSeconds -ge $intervaloPoll) {
              $ultimoPoll = $agora
              $maisNova = $null
              try { $maisNova = FF-RunMaisNova } catch { $maisNova = $null }
              if ($maisNova) {
                EncerrarLimpo "máquina nova (run $($maisNova.id)) chegou para assumir"
                break
              }
            }

            # (b) fim da janela de 5h50
            if ($agora -ge $fim) {
              EncerrarLimpo "janela de 5h50 concluída"
              Write-Host "Disparando a próxima máquina para não ficar sem bot..."
              [void](FF-DispararProxima)
              break
            }

            # (c) fallback: ninguém apareceu até 5h38 -> pede a próxima máquina agora
            if (-not $fallbackFeito -and $agora -ge $avisoFallback) {
              Write-Host "[$(Get-Date -Format 'HH:mm')] fallback: disparando a próxima máquina (pré-aquecimento em paralelo)."
              [void](FF-DispararProxima)
              $fallbackFeito = $true
            }

            # (d) vigia do bot
            $proc = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                    Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
            if (-not $proc) {
              Write-Host "[$(Get-Date -Format 'HH:mm')] o bot caiu - levantando de novo..."
              powershell -NoProfile -ExecutionPolicy Bypass -File .\iniciar_bot.ps1 *>&1 | ForEach-Object { Write-Host $_ }
              $proc = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
                      Where-Object { $_.CommandLine -like "*fireforce_bot.py*" }
            }
            if (((Get-Date) - $ultimoLog).TotalSeconds -ge 60) {
              $resta = [int](($fim - (Get-Date)).TotalMinutes)
              Write-Host "[$(Get-Date -Format 'HH:mm')] bot: $(if ($proc) { 'NO AR (PID ' + ($proc.ProcessId -join ',') + ')' } else { 'PARADO' }) | faltam $resta min"
              $ultimoLog = Get-Date
            }
            Start-Sleep -Seconds 1   # o poll acima controla o ritmo real das consultas
          }

      - name: 📄 Resumo e últimas linhas do log
        if: always()
        shell: pwsh
        run: |
          Write-Host "======================================================"
          Write-Host "  FIRE FORCE - resumo do ciclo"
          Write-Host "  RDP: Windows App > fireforce-rdp > runneradmin"
          Write-Host "  Atalhos na area de trabalho: Ligar / Reiniciar / Status"
          Write-Host "  Conferir no Discord: /saude"
          Write-Host "======================================================"
          if (Test-Path .\vigia.log) { Get-Content .\vigia.log -Tail 30 }
